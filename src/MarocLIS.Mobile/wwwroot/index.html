  <link rel="manifest" href="manifest.webmanifest">

    <span lang="fr">Erreur inattendue.</span> <span lang="ar" dir="rtl">خطأ غير متوقع.</span> <span lang="en">Unexpected error.</span>
    <a href="" class="reload">↻</a>
